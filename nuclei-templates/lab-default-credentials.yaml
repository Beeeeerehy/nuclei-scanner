id: lab-default-credentials
info:
  name: Default Admin Credentials Accepted (Teaching Lab)
  author: student
  severity: critical
  description: The login accepts the default admin/admin credentials, giving full access.
  tags: lab,default-login
http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username=admin&password=admin
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["Welcome, admin"]
