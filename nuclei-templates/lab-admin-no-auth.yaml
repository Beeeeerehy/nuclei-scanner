id: lab-admin-no-auth
info:
  name: Admin Panel Without Authentication (Teaching Lab)
  author: student
  severity: high
  description: The /admin/ page is reachable without logging in.
  tags: lab,auth
http:
  - method: GET
    path: ["{{BaseURL}}/admin/"]
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["Admin Panel"]
